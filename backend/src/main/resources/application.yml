spring:
  application:
    name: simrs-backend
  datasource:
    url: jdbc:postgresql://${SIMRS_DB_HOST:localhost}:${SIMRS_DB_PORT:5432}/${SIMRS_DB_NAME:medisafe}
    username: ${SIMRS_DB_USER:postgres}
    password: ${SIMRS_DB_PASSWORD:ibnrusyd}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: simrs-hikari
      maximum-pool-size: ${SIMRS_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${SIMRS_DB_MIN_IDLE:1}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQL95Dialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        implicit_naming_strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true
      additional-paths: src/main/java
      poll-interval: 1000
      quiet-period: 400

server:
  port: ${SERVER_PORT:9090}
  servlet:
    session:
      cookie:
        name: SIMRSSESSION

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origins: ${SIMRS_ALLOWED_ORIGINS:http://localhost:5173}
  rekap-gl-dir: ${REKAP_GL_DIR:./rekap-gl}
  auth:
    session-timeout-seconds: ${SIMRS_SESSION_TIMEOUT_SECONDS:3000}
  admission:
    card-fee: ${SIMRS_ADMISSION_CARD_FEE:0}
    coa-ar-key: ${SIMRS_ADMISSION_COA_AR_KEY:COA_INPATIENT_AR}
    registration-coa-key: ${SIMRS_ADMISSION_REGISTRATION_COA_KEY:COA_ADM}
    registration-coa-fallback-key: ${SIMRS_ADMISSION_REGISTRATION_COA_FALLBACK_KEY:COA_MISC_TRX}
  legacy:
    ui-pages: 281
    hibernate-mappings: 122
    ui-controllers: 112

  pajak:
    obat-rajal: ${PAJAK_OBAT_RAJAL:0.03}

satusehat:
  auth-url: ${SATUSEHAT_AUTH_URL:https://api-satusehat-stg.dto.kemkes.go.id/oauth2/v1/accesstoken}
  base-url: ${SATUSEHAT_BASE_URL:https://api-satusehat-stg.dto.kemkes.go.id/fhir-r4/v1}
  client-id: ${SATUSEHAT_CLIENT_ID:vC7jHpiCq2KMRglHdcaKlzyAlN40iN9tdVJiGtqSB4gYAfxm}
  client-secret: ${SATUSEHAT_CLIENT_SECRET:ACRcf5e8v5EXGXjgnNzYi1ClmotCbWipA5lHjLxyoSczxCnZixTMiQu8dejM905e}
  organization-id: ${SATUSEHAT_ORGANIZATION_ID:02908c60-9bde-4ded-9dbc-53feada02972}
  inpatient-location-id: ${SATUSEHAT_INPATIENT_LOCATION_ID:}
  connect-timeout-ms: ${SATUSEHAT_CONNECT_TIMEOUT_MS:10000}
  read-timeout-ms: ${SATUSEHAT_READ_TIMEOUT_MS:30000}
  outbox:
    enabled: ${SATUSEHAT_OUTBOX_ENABLED:true}
    interval-ms: ${SATUSEHAT_OUTBOX_INTERVAL_MS:60000}
    initial-delay-ms: ${SATUSEHAT_OUTBOX_INITIAL_DELAY_MS:30000}
    batch-size: ${SATUSEHAT_OUTBOX_BATCH_SIZE:20}
    max-attempts: ${SATUSEHAT_OUTBOX_MAX_ATTEMPTS:10}
